name: contabilidad_flutter
description: Aplicación de contabilidad personal desarrollada con Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.6.1

  # Navegación
  go_router: ^16.0.0

  # Base de datos
  sqflite: ^2.4.2
  path: ^1.9.1

  # Formato de fechas y números
  intl: ^0.20.2

  # Gráficos
  fl_chart: ^1.2.0

  # Exportación Excel
  excel: ^4.0.6

  # Acceso al sistema de archivos
  path_provider: ^2.1.5

  # Selección de archivos
  file_picker: ^10.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: system